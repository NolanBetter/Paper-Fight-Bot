<body>
<a class="skip" href="#main">Skip to content</a>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt=""><span><span class="p">PAPER </span>FIGHT <b>BOT</b></span></a>
    <nav>

      <a href="account.html">Account</a>
      <a href="#" data-modrinth>Download</a>
    </nav>
  </div>
</header>

<main id="main">

<div class="phead">
  <div class="wrap">
    <h1 id="listHeading">Your reports</h1>
    <p class="lede">Every report you have filed, and anything that has come back.</p>
  </div>
</div>

<section class="tight">
  <div class="wrap">

    <div id="listWrap" hidden>
      <div id="reportList" class="rep-list"></div>
      <div class="cta-row">
        <a class="btn" href="report.html">File a new report</a>
      </div>
    </div>

    <div id="threadWrap" hidden>
      <div class="cta-row" style="margin:0 0 26px">
        <a class="btn ghost" href="reports.html">All reports</a>
      </div>

      <div class="form" id="thread"></div>

      <div class="form" id="replyBox" hidden style="margin-top:22px">
        <label for="replyText">Reply</label>
        <textarea id="replyText" rows="5" placeholder="Write your reply"></textarea>
        <button class="btn" id="sendReply" type="button" style="margin-top:16px">Send reply</button>
        <p class="status" id="replyNote" hidden></p>

        <div id="ownerTools" hidden style="margin-top:22px">
          <label>Set status</label>
          <div class="cta-row" style="margin-top:8px">
            <button class="btn ghost" data-set-status="open" type="button">Open</button>
            <button class="btn ghost" data-set-status="answered" type="button">Answered</button>
            <button class="btn ghost" data-set-status="closed" type="button">Closed</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

</main>

<footer>
  <div class="wrap f-in">

</body>
</html>
